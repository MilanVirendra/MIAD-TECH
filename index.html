    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, white 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        


        /* Título da página */
        h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-align: center;
        }

        /* Container dos blocos */
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            max-width: 1200px;
        }

        /* Cada bloco */
        .card {
            background: white;
            width: 450px;
            height: 120px;
            border-radius: 20px;
            border: 2px solid black !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .card span {
            font-size: 1.0rem;
            font-weight: 600;
            color: #333;
        }

        /* Responsivo para celular */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .card {
                width: 275px;
                height: 120px;
            }
            .card img {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
